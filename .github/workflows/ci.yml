name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Server/client boundary
        run: bun run check:server-boundary

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test (with coverage threshold)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Bundle budget
        run: bun run check:bundle

      - name: Audit dependencies (high/critical fails the build)
        run: bun audit --audit-level=high

      - name: Audit dependencies (full report, informational)
        run: bun audit
        continue-on-error: true

  rls:
    name: Database migrations and RLS
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start isolated Supabase and apply migrations
        run: bunx supabase start

      - name: Run RLS integration tests
        run: bun run test:rls

      - name: Stop isolated Supabase
        if: always()
        run: bunx supabase stop

  native-android:
    name: Android unit tests
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'capacitor.config.*'
              - 'capacitor-shell/**'
              - 'src/**'
              - 'package.json'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # main peker mot produksjon (kaupet.no), alt annet (staging,
      # workflow_dispatch fra andre branches) peker mot staging.kaupet.no —
      # se product flavors i android/app/build.gradle og CAPACITOR_ENV-
      # bruken i capacitor.config.ts.
      - name: Bestem miljø
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "flavor=production" >> "$GITHUB_OUTPUT"
            echo "flavorCap=Production" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=staging" >> "$GITHUB_OUTPUT"
            echo "flavorCap=Staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # google-services.json er gitignoret (Firebase-nøkler for push).
      # android/app/build.gradle hopper stille over google-services-pluginet
      # hvis filen mangler — bygget lykkes, men APK-en mangler Firebase-
      # oppsett og appen krasjer så snart push-varslinger aktiveres.
      - name: Skriv google-services.json fra secret
        working-directory: android/app
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}

      - name: Sync Android project
        run: bunx cap sync android
        env:
          CAPACITOR_ENV: ${{ steps.env.outputs.flavor }}

      - name: Run Android tests
        working-directory: android
        run: ./gradlew test${{ steps.env.outputs.flavorCap }}DebugUnitTest

      - name: Build debug APK
        if: steps.filter.outputs.android == 'true'
        working-directory: android
        run: ./gradlew assemble${{ steps.env.outputs.flavorCap }}Debug
        env:
          # Gir hver publiserte APK et unikt, økende versionCode — se
          # android/app/build.gradle. github.run_number øker for hver
          # workflow-kjøring, uten behov for egen tellerstate.
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        if: steps.filter.outputs.android == 'true'
        with:
          name: android-debug-apk-${{ steps.env.outputs.flavor }}
          path: android/app/build/outputs/apk/${{ steps.env.outputs.flavor }}/debug/app-${{ steps.env.outputs.flavor }}-debug.apk
          retention-days: 14

      - name: Les app-versjon
        if: steps.filter.outputs.android == 'true' && github.event_name == 'push'
        id: app_version
        working-directory: android/app
        run: |
          name=$(grep -oP 'versionName\s+"\K[^"]+' build.gradle)
          echo "full=$name.$(printf '%03d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Fjern gamle APK-assets fra releasen
        if: steps.filter.outputs.android == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "android-preview-${{ github.ref_name }}" --json assets \
            --jq '.assets[].name' | while read -r name; do
            gh release delete-asset "android-preview-${{ github.ref_name }}" "$name" -y
          done

      - name: Publish APK as GitHub release preview
        if: steps.filter.outputs.android == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview-${{ github.ref_name }}
          name: >-
            Kaupet${{ steps.env.outputs.flavor == 'staging' && ' Staging' || '' }}
            (${{ github.ref_name }}) —
            v${{ steps.app_version.outputs.full }}
            (${{ steps.app_version.outputs.sha }})
          prerelease: true
          files: android/app/build/outputs/apk/${{ steps.env.outputs.flavor }}/debug/app-${{ steps.env.outputs.flavor }}-debug.apk

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [verify, rls, native-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: production
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Kategori-synk (staging -> produksjon) i produksjonens admin-panel
      # leser fra staging sitt Supabase-prosjekt med service-role. Disse må
      # også finnes som Worker-secrets (wrangler secret put), siden Worker-
      # runtime env ikke er det samme som CI build-env.
      - name: Set staging-sync secrets on the production Worker
        run: |
          echo "${{ vars.STAGING_SUPABASE_URL }}" | bunx wrangler secret put STAGING_SUPABASE_URL --name kaupet-no
          echo "${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}" | bunx wrangler secret put STAGING_SUPABASE_SERVICE_ROLE_KEY --name kaupet-no
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    name: E2E
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: [verify, rls, native-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

  staging-gate:
    name: Staging deployment gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bekrefter at det PR-en inneholder allerede er del av siste
      # vellykkede staging-deploy (deploy-staging-jobben under poster
      # automatisk deployment-status for "staging"-environmentet siden den
      # har environment: staging satt). "Require deployments to succeed"
      # på main sjekker PR-ens egen HEAD-SHA, ikke staging sin — derfor
      # posterer vi en egen deployment-status på PR-commiten nedenfor,
      # basert på dette resultatet.
      - name: Sjekk at PR-innholdet allerede er i siste vellykkede staging-deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin staging
          deployment=$(gh api "repos/${{ github.repository }}/deployments?environment=staging&per_page=1" --jq '.[0]')
          deploy_id=$(echo "$deployment" | jq -r '.id')
          deploy_sha=$(echo "$deployment" | jq -r '.sha')
          state=$(gh api "repos/${{ github.repository }}/deployments/$deploy_id/statuses" --jq 'sort_by(.created_at) | last | .state')

          if [ "$state" != "success" ]; then
            echo "Siste staging-deploy ($deploy_sha) har status '$state', ikke 'success'." >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$PR_HEAD" "$deploy_sha"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR-commit $PR_HEAD er ikke inkludert i staging sin siste deploy ($deploy_sha)." >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post deployment-status for denne PR-en
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          state="failure"
          [ "${{ steps.check.outputs.ok }}" = "true" ] && state="success"

          deploy_id=$(gh api "repos/${{ github.repository }}/deployments" \
            -f ref="$PR_HEAD" -f environment=staging -F auto_merge=false \
            --jq '.id')

          gh api "repos/${{ github.repository }}/deployments/$deploy_id/statuses" \
            -f state="$state" -f environment=staging \
            -f description="PR-innhold verifisert mot staging sin siste deploy"

          [ "$state" = "success" ]

  deploy-staging:
    name: Deploy to Cloudflare Workers (staging)
    needs: [verify, rls, native-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: staging
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_WORKER_NAME: kaupet-no-staging

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
