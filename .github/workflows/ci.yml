name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test (with coverage threshold)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Audit dependencies (high/critical fails the build)
        run: bun audit --audit-level=high

      - name: Audit dependencies (full report, informational)
        run: bun audit
        continue-on-error: true

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: production
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Kategori-synk (staging -> produksjon) i produksjonens admin-panel
      # leser fra staging sitt Supabase-prosjekt med service-role. Disse må
      # også finnes som Worker-secrets (wrangler secret put), siden Worker-
      # runtime env ikke er det samme som CI build-env.
      - name: Set staging-sync secrets on the production Worker
        run: |
          echo "${{ vars.STAGING_SUPABASE_URL }}" | bunx wrangler secret put STAGING_SUPABASE_URL --name kaupet-no
          echo "${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}" | bunx wrangler secret put STAGING_SUPABASE_SERVICE_ROLE_KEY --name kaupet-no
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    name: E2E
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Verify required Supabase env vars are set
        # Catches a missing repo variable/secret in seconds with a clear
        # message, instead of the job failing ~2 minutes in with a Playwright
        # timeout that gives no hint the actual cause was a missing env var
        # (see the SUPABASE_PUBLISHABLE_KEY incident this check exists for).
        run: |
          missing=""
          for var in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required env var(s) for E2E job:$missing"
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run e2e tests
        # Runs the dev server locally against the staging Supabase project —
        # not against https://staging.kaupet.no directly, since that domain
        # sits behind Cloudflare Access and would just serve the Access login.
        run: bun run test:e2e
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ vars.STAGING_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          # Cloudflare's public "always passes" Turnstile test site key — logins
          # in headless CI can't solve a real challenge. The staging Supabase
          # project's Turnstile secret must be set to the matching test secret
          # (1x0000000000000000000000000000AA) in its Auth settings for this to
          # verify; see https://developers.cloudflare.com/turnstile/troubleshooting/testing/
          VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

  deploy-staging:
    name: Deploy to Cloudflare Workers (staging)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: staging
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_WORKER_NAME: kaupet-no-staging

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
