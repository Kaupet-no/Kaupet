name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Server/client boundary
        run: bun run check:server-boundary

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test (with coverage threshold)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Bundle budget
        run: bun run check:bundle

      - name: Audit dependencies (high/critical fails the build)
        run: bun audit --audit-level=high

      - name: Audit dependencies (full report, informational)
        run: bun audit
        continue-on-error: true

  rls:
    name: Database migrations and RLS
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start isolated Supabase and apply migrations
        run: bunx supabase start

      - name: Run RLS integration tests
        run: bun run test:rls

      - name: Stop isolated Supabase
        if: always()
        run: bunx supabase stop

  native-android:
    name: Android unit tests
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'capacitor.config.*'
              - 'src/**'
              - 'package.json'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Android project
        run: bunx cap sync android

      - name: Run Android tests
        working-directory: android
        run: ./gradlew test

      - name: Build debug APK
        if: steps.filter.outputs.android == 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        if: steps.filter.outputs.android == 'true'
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK as GitHub release preview
        if: steps.filter.outputs.android == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview-${{ github.ref_name }}
          name: Android preview (${{ github.ref_name }})
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [verify, rls, native-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: production
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Kategori-synk (staging -> produksjon) i produksjonens admin-panel
      # leser fra staging sitt Supabase-prosjekt med service-role. Disse må
      # også finnes som Worker-secrets (wrangler secret put), siden Worker-
      # runtime env ikke er det samme som CI build-env.
      - name: Set staging-sync secrets on the production Worker
        run: |
          echo "${{ vars.STAGING_SUPABASE_URL }}" | bunx wrangler secret put STAGING_SUPABASE_URL --name kaupet-no
          echo "${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}" | bunx wrangler secret put STAGING_SUPABASE_SERVICE_ROLE_KEY --name kaupet-no
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    name: E2E
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: [verify, rls, native-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

  deploy-staging:
    name: Deploy to Cloudflare Workers (staging)
    needs: [verify, rls, native-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: staging
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_WORKER_NAME: kaupet-no-staging

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
