name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Minste standard for et offentlig repo; jobber som trenger mer
# eskalerer selv.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Server/client boundary
        run: bun run check:server-boundary

      - name: Safe-area boundary
        run: bun run check:safe-area

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test (with coverage threshold)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # Ingen av de andre stegene (tsc, vitest, `vite dev`) kjører faktisk den
      # bygde SSR-outputen slik Cloudflare Workers laster den (separate
      # ES-moduler pga. `no_bundle: true`). En vite/rolldown-oppgradering
      # (se commit som fikser produksjonsutfallet 2026-08-27) sendte SSR-
      # bygget i to sirkulære chunks som kun feilet i workerd — build,
      # typecheck og enhetstester så helt normale ut. Denne smoke-testen
      # kjører den faktiske worker-outputen i workerd via `wrangler dev` og
      # ville fanget akkurat den regresjonen.
      - name: Smoke test built Worker in workerd
        run: |
          bunx wrangler dev --config dist/server/wrangler.json --port 8788 &
          WRANGLER_PID=$!

          ok=false
          for _ in $(seq 1 30); do
            if curl -sS -f -D headers.txt -o page.html http://localhost:8788/ 2>/dev/null; then
              body=$(cat page.html)
              ok=true
              break
            fi
            sleep 1
          done

          kill "$WRANGLER_PID" 2>/dev/null || true
          wait "$WRANGLER_PID" 2>/dev/null || true

          if [ "$ok" != "true" ]; then
            echo "Worker svarte aldri med 200 på http://localhost:8788/" >&2
            exit 1
          fi

          if echo "$body" | grep -q "Siden lastet ikke"; then
            echo "Worker returnerte 200, men med SSR-fallback-feilsiden som body." >&2
            exit 1
          fi

          # E2E kjører mot dev-serveren, så produksjons-CSP-en testes bare her:
          # én CSP-header med nonce i script-src, og hvert inline-skript må
          # bære den noncen — ellers blokkerer nettleseren hydreringen.
          python3 - <<'PY'
          import re, sys
          csp = [l.split(":", 1)[1] for l in open("headers.txt") if l.lower().startswith("content-security-policy:")]
          script_src = next((d for d in csp[0].split(";") if d.strip().startswith("script-src")), "") if len(csp) == 1 else ""
          nonce = re.search(r"'nonce-([^']+)'", script_src)
          inline = [t for t in re.findall(r"<script\b[^>]*>", open("page.html", encoding="utf-8").read()) if " src=" not in t]
          missing = [t for t in inline if not nonce or f'nonce="{nonce.group(1)}"' not in t]
          if len(csp) != 1 or not nonce or "unsafe-inline" in script_src or not inline or missing:
              sys.exit(f"CSP-nonce-sjekk feilet: {len(csp)} CSP-header(e), script-src={script_src.strip()!r}, {len(inline)} inline-skript, uten riktig nonce: {missing[:3]}")
          print(f"CSP-nonce OK: {len(inline)} inline-skript bærer noncen.")
          PY

      - name: Bundle budget
        run: bun run check:bundle

      # bun audit mister av og til forbindelsen til npm sitt audit-endepunkt
      # og timer ut etter ~5 min ("Timeout"/"ConnectionClosed: audit request
      # failed") uten at det har noe med prosjektets avhengigheter å gjøre.
      # Retry kompenserer for denne nettverksflaksen, samme mønster som
      # supabase start-steget under.
      - name: Audit dependencies (high/critical fails the build)
        run: |
          for attempt in 1 2 3; do
            if bun audit --audit-level=high; then
              exit 0
            fi
            echo "bun audit feilet (forsøk $attempt/3), prøver igjen …" >&2
            sleep 5
          done
          exit 1

      - name: Audit dependencies (full report, informational)
        run: bun audit
        continue-on-error: true

  rls:
    name: Database migrations and RLS
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # supabase start har en kjent race mot Docker der en intern
      # "stop old containers"-opprydding kan kollidere med oppstart av den
      # nye db-containeren på port 54322 ("address already in use").
      # Retry med en full stop mellom forsøk kompenserer for det.
      - name: Start isolated Supabase and apply migrations
        run: |
          for attempt in 1 2 3; do
            if bunx supabase start; then
              exit 0
            fi
            echo "supabase start feilet (forsøk $attempt/3), rydder opp og prøver igjen …" >&2
            bunx supabase stop --no-backup || true
            sleep 5
          done
          exit 1

      - name: Run RLS integration tests
        run: bun run test:rls

      - name: Stop isolated Supabase
        if: always()
        run: bunx supabase stop

  native-android:
    name: Android unit tests
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      flavor: ${{ steps.env.outputs.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'capacitor.config.*'
              - 'capacitor-shell/**'
              - 'src/**'
              - 'package.json'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # main peker mot produksjon (kaupet.no), alt annet (staging,
      # workflow_dispatch fra andre branches) peker mot staging.kaupet.no —
      # se product flavors i android/app/build.gradle og CAPACITOR_ENV-
      # bruken i capacitor.config.ts.
      - name: Bestem miljø
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "flavor=production" >> "$GITHUB_OUTPUT"
            echo "flavorCap=Production" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=staging" >> "$GITHUB_OUTPUT"
            echo "flavorCap=Staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each application id needs its own Firebase registration. Never put
      # production credentials in the isolated staging package.
      - name: Skriv google-services.json fra miljøspesifikk secret
        if: steps.filter.outputs.android == 'true'
        working-directory: android/app
        run: |
          if [ "${{ steps.env.outputs.flavor }}" = "production" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_STAGING_JSON" > google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_STAGING_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_STAGING_JSON }}

      - name: Sync Android project
        if: steps.filter.outputs.android == 'true'
        run: bunx cap sync android
        env:
          CAPACITOR_ENV: ${{ steps.env.outputs.flavor }}

      - name: Run Android tests
        if: steps.filter.outputs.android == 'true'
        working-directory: android
        run: ./gradlew test${{ steps.env.outputs.flavorCap }}DebugUnitTest

      - name: Build debug APK
        if: steps.filter.outputs.android == 'true'
        working-directory: android
        run: ./gradlew assemble${{ steps.env.outputs.flavorCap }}Debug
        env:
          # Gir hver publiserte APK et unikt, økende versionCode — se
          # android/app/build.gradle. github.run_number øker for hver
          # workflow-kjøring, uten behov for egen tellerstate.
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.filter.outputs.android == 'true'
        with:
          name: android-debug-apk-${{ steps.env.outputs.flavor }}
          path: android/app/build/outputs/apk/${{ steps.env.outputs.flavor }}/debug/app-${{ steps.env.outputs.flavor }}-debug.apk
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [verify, rls, native-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sjekk at påkrevde R2-variabler er satt
        env:
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_CLEANUP_SECRET: ${{ secrets.R2_CLEANUP_SECRET }}
        run: |
          if [ -z "$VITE_R2_PUBLIC_BASE_URL" ]; then
            echo "VITE_R2_PUBLIC_BASE_URL mangler i production-miljøet — hele siden krasjer uten den." >&2
            exit 1
          fi
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2_ACCOUNT_ID mangler i production-miljøet — CSP-en ville blokkert meldingsvedlegg." >&2
            exit 1
          fi
          if [ -z "$R2_CLEANUP_SECRET" ]; then
            echo "R2_CLEANUP_SECRET mangler i production-miljøet — opprydningsjobben ville svart 401 i det stille." >&2
            exit 1
          fi

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: production
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}

      - name: Sjekk at R2-domenene havnet i den bygde CSP-en
        env:
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: |
          img_src=$(grep -o "img-src [^\"]*" dist/server/index.mjs | head -1)
          if [ -z "$img_src" ]; then
            echo "Fant ingen img-src i production-bygget — CSP-en mangler helt." >&2
            exit 1
          fi
          for domain in "$VITE_R2_PUBLIC_BASE_URL" "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"; do
            case "$img_src" in
              *"$domain"*) ;;
              *) echo "$domain mangler i img-src i production-bygget — bilder ville blitt blokkert av CSP-en." >&2; exit 1 ;;
            esac
          done

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Category sync reads public staging tables with a publishable key. A
      # production Worker must never retain staging's service-role credential.
      - name: Set staging-sync read secrets on the production Worker
        run: |
          echo "${{ vars.STAGING_SUPABASE_URL }}" | bunx wrangler secret put STAGING_SUPABASE_URL --name kaupet-no
          echo "${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}" | bunx wrangler secret put STAGING_SUPABASE_PUBLISHABLE_KEY --name kaupet-no
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set R2 secrets on the production Worker
        run: |
          echo "${{ vars.R2_ACCOUNT_ID }}" | bunx wrangler secret put R2_ACCOUNT_ID --name kaupet-no
          echo "${{ secrets.R2_ACCESS_KEY_ID }}" | bunx wrangler secret put R2_ACCESS_KEY_ID --name kaupet-no
          echo "${{ secrets.R2_SECRET_ACCESS_KEY }}" | bunx wrangler secret put R2_SECRET_ACCESS_KEY --name kaupet-no
          echo "${{ vars.R2_BILDER_BUCKET }}" | bunx wrangler secret put R2_BILDER_BUCKET --name kaupet-no
          echo "${{ vars.R2_VEDLEGG_BUCKET }}" | bunx wrangler secret put R2_VEDLEGG_BUCKET --name kaupet-no
          echo "${{ vars.R2_PUBLIC_BASE_URL }}" | bunx wrangler secret put R2_PUBLIC_BASE_URL --name kaupet-no
          echo "${{ secrets.R2_CLEANUP_SECRET }}" | bunx wrangler secret put R2_CLEANUP_SECRET --name kaupet-no
          # Bildekøen (/api/public/images/process) er valgfri inntil hemmeligheten er satt:
          # uten den blir jobbene bare liggende som «Behandles», deployen stopper ikke.
          if [ -n "${{ secrets.IMAGE_JOBS_SECRET }}" ]; then
            echo "${{ secrets.IMAGE_JOBS_SECRET }}" | bunx wrangler secret put IMAGE_JOBS_SECRET --name kaupet-no
          else
            echo "::warning::IMAGE_JOBS_SECRET mangler — bilder fra Proff-import/API blir ikke behandlet."
          fi
          # Varsel om API-nøkler som snart utløper (/api/public/api-keys/expiry-notify).
          if [ -n "${{ secrets.API_KEY_EXPIRY_SECRET }}" ]; then
            echo "${{ secrets.API_KEY_EXPIRY_SECRET }}" | bunx wrangler secret put API_KEY_EXPIRY_SECRET --name kaupet-no
          else
            echo "::warning::API_KEY_EXPIRY_SECRET mangler — superbrukere varsles ikke før API-nøkler utløper."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  android-release:
    # Egen jobb utelukkende for å holde `contents: write` unna jobben som
    # bygger PR-levert kode og kjører `bun install`. Kjører bare på push.
    name: Android release preview
    needs: native-android
    if: needs.native-android.outputs.android == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-debug-apk-${{ needs.native-android.outputs.flavor }}
          path: apk

      - name: Les app-versjon
        id: app_version
        working-directory: android/app
        run: |
          name=$(grep -oP 'versionName\s+"\K[^"]+' build.gradle)
          echo "full=$name.$(printf '%03d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Fjern gamle APK-assets fra releasen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "android-preview-${{ github.ref_name }}" --json assets \
            --jq '.assets[].name' | while read -r name; do
            gh release delete-asset "android-preview-${{ github.ref_name }}" "$name" -y
          done

      - name: Publish APK as GitHub release preview
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: android-preview-${{ github.ref_name }}
          name: >-
            Kaupet${{ needs.native-android.outputs.flavor == 'staging' && ' Staging' || '' }}
            (${{ github.ref_name }}) —
            v${{ steps.app_version.outputs.full }}
            (${{ steps.app_version.outputs.sha }})
          prerelease: true
          files: apk/app-${{ needs.native-android.outputs.flavor }}-debug.apk

  e2e:
    # Ingen `if`: workflowen trigges på pull_request, push og workflow_dispatch,
    # og E2E skal kjøre på alle tre. Tidligere sto push utenfor, så merge-
    # commits til staging gikk inn uten at E2E kjørte — et grønt resultat på en
    # PR sier bare at testene var grønne mot PR-ens base. Fem tester lå røde på
    # staging i dagevis før noen oppdaget det (se #275).
    #
    # Merk at verken `deploy` eller `deploy-staging` har `needs: e2e`, så dette
    # gater ikke utrulling — det gjør bruddet synlig i kjøringen. Skal E2E
    # faktisk stoppe en staging-deploy, må e2e legges til i deploy-staging.
    name: E2E
    needs: [verify, rls, native-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

  staging-gate:
    name: Staging deployment gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Bekrefter at det PR-en inneholder allerede er del av en vellykket
      # staging-deploy (deploy-staging-jobben poster automatisk deployment-
      # status for "staging"-environmentet siden den har environment:
      # staging satt). "Require deployments to succeed" på main sjekker
      # PR-ens egen HEAD-SHA, ikke staging sin — derfor posterer vi en egen
      # deployment-status på PR-commiten nedenfor, basert på dette
      # resultatet.
      #
      # deploy-staging krever at verify+rls+native-android fullfører først,
      # så en fersk push til staging kan ligge flere minutter bak denne
      # jobben (som trigges parallelt av samme push, men uten den
      # ventetiden). Derfor polles det i stedet for én engangssjekk.
      - name: Vent på og sjekk vellykket staging-deploy for PR-innholdet
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin staging
          ok=false
          elapsed=0
          timeout=720
          interval=20

          while [ "$elapsed" -lt "$timeout" ]; do
            # Bare ekte staging-deployer teller. Statusen denne jobben selv
            # poster nedenfor ligger i samme miljø, og uten filteret ville den
            # blitt lest som "siste staging-deploy" av neste PR — som da
            # sammenlignet seg mot en forrige PR sin HEAD i stedet for mot
            # staging (task-feltet skiller dem, se steget under).
            deploys=$(gh api "repos/${{ github.repository }}/deployments?environment=staging&per_page=30" \
              | jq '[.[] | select(.task == "deploy")]')

            # Eksakt treff: PR_HEAD er selv deployet.
            exact=$(echo "$deploys" | jq -r --arg sha "$PR_HEAD" '[.[] | select(.sha == $sha)][0].id // empty')

            if [ -n "$exact" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$exact/statuses" --jq 'sort_by(.created_at) | last | .state // "pending"')
              if [ "$state" = "success" ]; then
                ok=true
                break
              fi
            fi

            # Ingen vellykket eksakt deploy — sjekk om PR_HEAD er en ancestor
            # av siste vellykkede staging-deploy (staging kan ha gått forbi
            # PR-en siden den ble åpnet). Sjekken kjøres også når det finnes
            # en eksakt deploy som ikke er vellykket, ellers ville én mislykket
            # deploy på PR-ens SHA blokkere porten helt til timeout.
            latest=$(echo "$deploys" | jq '.[0] // empty')
            latest_id=$(echo "$latest" | jq -r '.id // empty')
            latest_sha=$(echo "$latest" | jq -r '.sha // empty')
            if [ -n "$latest_id" ]; then
              latest_state=$(gh api "repos/${{ github.repository }}/deployments/$latest_id/statuses" --jq 'sort_by(.created_at) | last | .state // "pending"')
              if [ "$latest_state" = "success" ] && git merge-base --is-ancestor "$PR_HEAD" "$latest_sha" 2>/dev/null; then
                ok=true
                break
              fi
            fi

            echo "Venter på vellykket staging-deploy for $PR_HEAD … (${elapsed}/${timeout}s)"
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = "true" ] || echo "Fant ingen vellykket staging-deploy som inkluderer $PR_HEAD innen ${timeout}s." >&2

      - name: Post deployment-status for denne PR-en
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          state="failure"
          [ "${{ steps.check.outputs.ok }}" = "true" ] && state="success"

          # required_contexts må sendes eksplisitt som tom liste, ellers
          # avviser deployment-endepunktet med 409 hvis andre required
          # status-sjekker på PR-en ikke er "success" ennå.
          # task: "staging-gate" gjør at steget over kan skille denne
          # syntetiske deploymenten fra de ekte (task: "deploy"). Miljønavnet
          # må bli stående som "staging" for at "Require deployments to
          # succeed" på main skal se statusen.
          deploy_id=$(jq -n --arg ref "$PR_HEAD" \
            '{ref: $ref, environment: "staging", task: "staging-gate", auto_merge: false, required_contexts: []}' \
            | gh api "repos/${{ github.repository }}/deployments" --input - --jq '.id')

          gh api "repos/${{ github.repository }}/deployments/$deploy_id/statuses" \
            -f state="$state" -f environment=staging \
            -f description="PR-innhold verifisert mot staging sin deploy"

          [ "$state" = "success" ]

  deploy-staging:
    name: Deploy to Cloudflare Workers (staging)
    needs: [verify, rls, native-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sjekk at påkrevde R2-variabler er satt
        env:
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_CLEANUP_SECRET: ${{ secrets.R2_CLEANUP_SECRET }}
        run: |
          if [ -z "$VITE_R2_PUBLIC_BASE_URL" ]; then
            echo "VITE_R2_PUBLIC_BASE_URL mangler i staging-miljøet — hele siden krasjer uten den." >&2
            exit 1
          fi
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2_ACCOUNT_ID mangler i staging-miljøet — CSP-en ville blokkert meldingsvedlegg." >&2
            exit 1
          fi
          if [ -z "$R2_CLEANUP_SECRET" ]; then
            echo "R2_CLEANUP_SECRET mangler i staging-miljøet — opprydningsjobben ville svart 401 i det stille." >&2
            exit 1
          fi

      - name: Build
        run: bun run build
        env:
          VITE_ENVIRONMENT: staging
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: kaupet-no-staging

      - name: Sjekk at R2-domenene havnet i den bygde CSP-en
        env:
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: |
          img_src=$(grep -o "img-src [^\"]*" dist/server/index.mjs | head -1)
          if [ -z "$img_src" ]; then
            echo "Fant ingen img-src i staging-bygget — CSP-en mangler helt." >&2
            exit 1
          fi
          for domain in "$VITE_R2_PUBLIC_BASE_URL" "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"; do
            case "$img_src" in
              *"$domain"*) ;;
              *) echo "$domain mangler i img-src i staging-bygget — bilder ville blitt blokkert av CSP-en." >&2; exit 1 ;;
            esac
          done

      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set R2 secrets on the staging Worker
        run: |
          echo "${{ vars.R2_ACCOUNT_ID }}" | bunx wrangler secret put R2_ACCOUNT_ID --name kaupet-no-staging
          echo "${{ secrets.R2_ACCESS_KEY_ID }}" | bunx wrangler secret put R2_ACCESS_KEY_ID --name kaupet-no-staging
          echo "${{ secrets.R2_SECRET_ACCESS_KEY }}" | bunx wrangler secret put R2_SECRET_ACCESS_KEY --name kaupet-no-staging
          echo "${{ vars.R2_BILDER_BUCKET }}" | bunx wrangler secret put R2_BILDER_BUCKET --name kaupet-no-staging
          echo "${{ vars.R2_VEDLEGG_BUCKET }}" | bunx wrangler secret put R2_VEDLEGG_BUCKET --name kaupet-no-staging
          echo "${{ vars.R2_PUBLIC_BASE_URL }}" | bunx wrangler secret put R2_PUBLIC_BASE_URL --name kaupet-no-staging
          echo "${{ secrets.R2_CLEANUP_SECRET }}" | bunx wrangler secret put R2_CLEANUP_SECRET --name kaupet-no-staging
          # Bildekøen (/api/public/images/process) er valgfri inntil hemmeligheten er satt:
          # uten den blir jobbene bare liggende som «Behandles», deployen stopper ikke.
          if [ -n "${{ secrets.IMAGE_JOBS_SECRET }}" ]; then
            echo "${{ secrets.IMAGE_JOBS_SECRET }}" | bunx wrangler secret put IMAGE_JOBS_SECRET --name kaupet-no-staging
          else
            echo "::warning::IMAGE_JOBS_SECRET mangler — bilder fra Proff-import/API blir ikke behandlet."
          fi
          # Varsel om API-nøkler som snart utløper (/api/public/api-keys/expiry-notify).
          if [ -n "${{ secrets.API_KEY_EXPIRY_SECRET }}" ]; then
            echo "${{ secrets.API_KEY_EXPIRY_SECRET }}" | bunx wrangler secret put API_KEY_EXPIRY_SECRET --name kaupet-no-staging
          else
            echo "::warning::API_KEY_EXPIRY_SECRET mangler — superbrukere varsles ikke før API-nøkler utløper."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
