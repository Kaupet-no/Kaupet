name: Dependabot lockfile update

# Dependabot only updates package.json for npm-ecosystem PRs — it has no
# native support for bun.lock, so `bun install --frozen-lockfile` in CI
# fails on every dependency bump. This regenerates and pushes the lockfile
# back onto the PR branch before the verify job runs.
on:
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  update-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # --ignore-scripts: this job only needs a resolved lockfile, never
      # code execution from a dependency tree that hasn't been reviewed yet.
      - name: Update lockfile
        run: bun install --ignore-scripts

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Update bun.lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
