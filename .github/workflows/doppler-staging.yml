name: Doppler-pilot (staging)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doppler-staging
  cancel-in-progress: false

jobs:
  sync-mistral:
    name: Synk Mistral-nøkkel til staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hent pilotnøkkelen og oppdater staging-Workeren
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${DOPPLER_TOKEN:?DOPPLER_TOKEN mangler i staging}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN mangler i staging}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID mangler i staging}"
          umask 077
          response=$(mktemp)
          payload=$(mktemp)
          trap 'rm -f "$response" "$payload"' EXIT

          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $DOPPLER_TOKEN" \
            --get 'https://api.doppler.com/v3/configs/config/secrets/download' \
            --data-urlencode 'project=kaupet' \
            --data-urlencode 'config=stg' \
            --data-urlencode 'format=json' \
            --data-urlencode 'secrets=MISTRAL_API_KEY' \
            --output "$response"

          jq -e '
            .MISTRAL_API_KEY | select(type == "string") |
            select(length > 0 and (test("[\\r\\n]") | not)) |
            {MISTRAL_API_KEY: .}
          ' "$response" > "$payload"
          echo "::add-mask::$(jq -r '.MISTRAL_API_KEY' "$payload")"
          bunx wrangler secret bulk "$payload" --name kaupet-no-staging
          echo 'MISTRAL_API_KEY er distribuert til kaupet-no-staging. Test KI-kategoriforslag i staging.' >> "$GITHUB_STEP_SUMMARY"
