name: Doppler-pilot (staging)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Kontroll uten synk, eller distribusjon av nye verdier
        type: choice
        options: [verify, sync]
        default: verify
        required: true

permissions:
  contents: read

concurrency:
  group: doppler-staging
  cancel-in-progress: false

jobs:
  sync-pilot:
    name: Kontroller eller synk pilothemmeligheter til staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hent og verifiser pilothemmelighetene
        shell: bash
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          OPERATION: ${{ inputs.operation }}
          OLD_IMAGE_JOBS_SECRET: ${{ secrets.IMAGE_JOBS_SECRET }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/doppler-staging.sh
